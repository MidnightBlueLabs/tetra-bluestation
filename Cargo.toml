[workspace]
resolver = "2"

members = [
    # Core libraries
    "crates/tetra-core",
    "crates/tetra-saps",
    "crates/tetra-config",
    "crates/tetra-pdus",
    "crates/tetra-entities",
    
    # Binaries
    "bins/bluestation-bs",
    "bins/bluestation-telemetry",
    "bins/bluestation-control",
    "bins/pdu-tool",
]

default-members = ["bins/bluestation-bs"]

[workspace.package]
version = "0.6.0"
edition = "2024"
authors = ["Wouter Bokslag / Midnight Blue"]
license = "MIT"

[workspace.dependencies]
# Internal crates
tetra-core = { path = "crates/tetra-core" }
tetra-pdus = { path = "crates/tetra-pdus" }
tetra-config = { path = "crates/tetra-config" }
tetra-saps = { path = "crates/tetra-saps" }
tetra-entities = { path = "crates/tetra-entities" }

# External dependencies
argon2 = "0.5"
as-any = "0.3.2"
base64 = "0.23.1"
bitcode = "0.6.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
clap = { version = "4.6.7", features = ["derive"] }
const_format = "0.2.36"
crossbeam-channel = "0.5"
ctrlc = "3"
git-version = "0.3.9"
httparse = "1.10"
md5 = "0.8.1"
num = "0.4.3"
num-complex = "0.4.6"
quinn = "0.11"
rand = "0.9.2"
rand_core = { version = "0.6", features = ["getrandom"] }
rustfft = "6.4.1"
rustls = { version = "0.23", default-features = false }
rustls-native-certs = "0.8.4"
rustls-pemfile = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
soapysdr = "0.5.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
toml = "1.1.6"
tracing = { version = "0.1.44", features = ["std"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
uuid = { version = "1", features = ["v4"] }
