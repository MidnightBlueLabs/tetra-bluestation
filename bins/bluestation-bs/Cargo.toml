[package]
name = "bluestation-bs"
version.workspace = true
edition.workspace = true

[[bin]]
name = "bluestation-bs"
path = "src/main.rs"

[dependencies]
tetra-core = { workspace = true }
tetra-config = { workspace = true }
tetra-saps = { workspace = true }
tetra-entities = { workspace = true }

clap = { workspace = true }
ctrlc = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
rustls = { workspace = true }

[features]
default = ["net-transport-websocket"]

net-transport-quic = ["tetra-entities/net-transport-quic"]
net-transport-tcp = ["tetra-entities/net-transport-tcp"]
net-transport-websocket = ["tetra-entities/net-transport-websocket"]
